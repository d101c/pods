[package]
name = "podsd"
description = "The pods engine: owns the AAP link to the AirPods and serves io.github.d101c.Pods1 on the session bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "podsd"
path = "src/main.rs"

[[bin]]
name = "podsctl"
path = "src/bin/podsctl.rs"

[dependencies]
pods-proto.workspace = true
pods-bt.workspace = true
pods-motion.workspace = true
pods-spatial.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
zbus.workspace = true
futures-util.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "process", "io-util"] }
tempfile.workspace = true
